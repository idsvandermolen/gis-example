[tasks.check-updates]
description = "Check for updates to dependencies"
run = "uv lock --upgrade --dry-run"

[tasks.upgrade]
description = "Upgrade dependencies"
run = "uv sync--upgrade"

[tasks.generate-django-secret-key]
description = "Generate a Django secret key"
run = "uv run python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())'"
